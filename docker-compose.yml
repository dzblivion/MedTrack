name: medtrack

# Ambiente de desenvolvimento. As senhas do banco abaixo são só para uso local.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: medtrack
      MYSQL_USER: medtrack
      MYSQL_PASSWORD: medtrack
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 3307 no computador para não conflitar com um MySQL instalado na máquina.
      - "127.0.0.1:3307:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
      # Os .sql desta pasta rodam em ordem alfabética, só na primeira vez que o banco é criado.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_USER: medtrack
      DB_PASSWORD: medtrack
      DB_NAME: medtrack
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_mysql:
